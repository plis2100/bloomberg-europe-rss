name: Actualizar RSS Bloomberg España

on:
  workflow_dispatch:

  schedule:
    # Cada 30 minutos.
    # El programa comprueba después la hora española.
    - cron: "*/30 5-21 * * 1-6"

permissions:
  contents: write

concurrency:
  group: actualizar-rss-bloomberg-espana
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Crear RSS
        run: python actualizar_rss.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rss.xml

          if git diff --cached --quiet; then
            echo "No hay noticias nuevas"
          else
            git commit -m "Actualizar RSS Bloomberg España"
            git push
          fi
